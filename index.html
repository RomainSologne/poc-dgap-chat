<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fil opérationnel DGAP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: "Avenir Next", Arial, sans-serif;
            background: #002632;
            color: #EAF2F7;
        }

        .chat {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            padding: 10px 14px;
            border-bottom: 1px solid #174652;
            background: #002632;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .live {
            color: #39D98A;
            font-size: 10px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 4px;
            font-size: 11px;
            color: #91A7B4;
        }

        /* =====================================================
           MESSAGES
           ===================================================== */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            scroll-behavior: smooth;
        }

        .message {
            width: 100%;
            margin-bottom: 9px;
        }

        .message.pc {
            text-align: left;
        }

        .message.convoi {
            text-align: right;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 3px;
            font-size: 10px;
            color: #91A7B4;
            max-width: 85%;
        }

        .message.convoi .meta {
            margin-left: auto;
        }

        .sender {
            font-weight: 700;
        }

        .pc .sender {
            color: #F59E0B;
        }

        .convoi .sender {
            color: #39D98A;
        }

        /* =====================================================
           BULLES
           ===================================================== */

        .bubble {
            display: inline-block;
            width: auto;
            min-width: 70px;
            max-width: 85%;
            padding: 7px 10px;
            border-radius: 8px;

            font-size: 12px;
            line-height: 1.35;

            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .pc .bubble {
            background: #5A392C;
            border-left: 3px solid #F59E0B;
        }

        .convoi .bubble {
            background: #16463E;
            border-right: 3px solid #39D98A;
        }

        .message.alert .bubble {
            background: #4A3027;
            border-left: 3px solid #F59E0B;
        }

        .message.alert .sender {
            color: #F59E0B;
        }

        /* =====================================================
           MESSAGES SYSTEME
           ===================================================== */

        .system {
            text-align: center;
            color: #91A7B4;
            font-size: 10px;
            margin: 10px 0;
        }

        .system span {
            display: inline-block;
            background: #10333E;
            border-radius: 12px;
            padding: 4px 9px;
        }

        /* =====================================================
           STATUS / ERREURS
           ===================================================== */

        .status {
            display: none;
            padding: 7px 10px;
            font-size: 10px;
            border-top: 1px solid #174652;
        }

        .status.error {
            display: block;
            background: #4A2020;
            color: #FFB8B8;
        }

        .status.info {
            display: block;
            background: #10333E;
            color: #AFC2CE;
        }

        /* =====================================================
           ACTIONS DEMO
           ===================================================== */

        .demo-actions {
            display: flex;
            gap: 5px;
            padding: 7px 10px;
            border-top: 1px solid #174652;
            background: #002632;
        }

        .demo-actions button {
            flex: 1;

            border: 1px solid #28515D;
            background: #0C3541;
            color: #AFC2CE;

            border-radius: 5px;

            padding: 6px 3px;

            font-size: 9px;

            cursor: pointer;
        }

        .demo-actions button:hover {
            background: #174652;
            color: white;
        }

        /* =====================================================
           SAISIE
           ===================================================== */

        .input-area {
            display: flex;

            padding: 10px;

            gap: 7px;

            background: #001E27;

            border-top: 1px solid #174652;
        }

        .input-area input {
            flex: 1;

            background: #0C3541;

            border: 1px solid #28515D;

            border-radius: 6px;

            padding: 9px 10px;

            color: white;

            outline: none;

            font-size: 12px;
        }

        .input-area input::placeholder {
            color: #778E99;
        }

        .input-area input:focus {
            border-color: #39D98A;
        }

        .send {
            width: 38px;

            border: none;

            border-radius: 6px;

            background: #007AC2;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        .send:hover {
            background: #1693D2;
        }

        .send:disabled,
        .demo-actions button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

    </style>
</head>


<body>

<div class="chat">

    <!-- HEADER -->

    <div class="header">

        <div class="header-top">

            <div class="title">
                FIL OPÉRATIONNEL
            </div>

            <div class="live">
                ● EN DIRECT
            </div>

        </div>

        <div
            class="subtitle"
            id="subtitle">
            TRANSFERT-001
        </div>

    </div>


    <!-- MESSAGES -->

    <div
        class="messages"
        id="messages">

        <div class="system">
            <span>
                Connexion au canal opérationnel…
            </span>
        </div>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status">
    </div>


    <!-- ACTIONS DEMO -->

    <div class="demo-actions">

        <button onclick="scenario('TRAFIC')">
            TRAFIC
        </button>

        <button onclick="scenario('SECURITE')">
            SÉCURITÉ
        </button>

        <button onclick="scenario('INCIDENT')">
            INCIDENT
        </button>

        <button onclick="scenario('REPRISE')">
            REPRISE
        </button>

    </div>


    <!-- SAISIE -->

    <div class="input-area">

        <input
            id="input"
            type="text"
            placeholder="Écrire un message…"
            autocomplete="off"
        >

        <button
            id="send"
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>

/* ============================================================
   CONFIGURATION
   ============================================================ */

const SERVICE_URL =
    "https://services.arcgis.com/d3voDfTFbHOCRwVR/arcgis/rest/services/Messages_Transfert/FeatureServer/0";

const MISSION_ID = "TRANSFERT-001";

const POLL_MS = 2000;


/* ============================================================
   ROLE DE L'UTILISATEUR

   Dashboard :
   ?role=pc

   iPhone :
   ?role=convoi
   ============================================================ */

const params =
    new URLSearchParams(
        window.location.search
    );

const role = (
    params.get("role") || ""
)
    .trim()
    .toLowerCase();


let AUTHOR;


if (role === "convoi") {

    AUTHOR = "CONVOI-01";

}
else if (role === "pc") {

    AUTHOR = "PC TRANSFERT";

}
else {

    AUTHOR = "ROLE NON DEFINI";

}


/* ============================================================
   VARIABLES
   ============================================================ */

let lastSignature = "";

let sending = false;


/* ============================================================
   AFFICHAGE DU ROLE
   ============================================================ */

document
    .getElementById("subtitle")
    .textContent =
        `${MISSION_ID} • ${AUTHOR}`;


/* ============================================================
   SECURISATION TEXTE HTML
   ============================================================ */

function esc(value) {

    return String(value ?? "")
        .replace(
            /[&<>'"]/g,
            char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                "\"": "&quot;"
            })[char]
        );

}


/* ============================================================
   FORMATAGE HEURE
   ============================================================ */

function formatTime(epoch) {

    if (!epoch) {
        return "";
    }

    const date =
        new Date(epoch);

    return date.toLocaleTimeString(
        "fr-FR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ============================================================
   MESSAGE STATUS
   ============================================================ */

function showStatus(
    text,
    type = "info"
) {

    const element =
        document.getElementById("status");

    element.className =
        `status ${type}`;

    element.textContent =
        text;


    if (type === "info") {

        setTimeout(
            () => {

                element.className =
                    "status";

            },
            1800
        );

    }

}


/* ============================================================
   APPEL REST ARCGIS
   ============================================================ */

async function arcgisPost(
    path,
    data
) {

    const body =
        new URLSearchParams({
            ...data,
            f: "json"
        });


    const response =
        await fetch(
            `${SERVICE_URL}/${path}`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded;charset=UTF-8"
                },

                body: body
            }
        );


    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status}`
        );

    }


    const json =
        await response.json();


    if (json.error) {

        let message =
            json.error.message;

        if (
            json.error.details &&
            json.error.details.length
        ) {

            message +=
                ": " +
                json.error.details.join("; ");

        }

        throw new Error(message);

    }


    return json;

}


/* ============================================================
   LECTURE DES MESSAGES
   ============================================================ */

async function loadMessages() {

    try {

        const escapedMission =
            MISSION_ID.replaceAll(
                "'",
                "''"
            );


        const where =
            `Mission='${escapedMission}'`;


        const json =
            await arcgisPost(
                "query",
                {
                    where: where,

                    outFields:
                        "OBJECTID,Mission,Auteur,Message,GDH,Types",

                    orderByFields:
                        "GDH ASC, OBJECTID ASC",

                    returnGeometry:
                        "false",

                    resultRecordCount:
                        "500"
                }
            );


        const features =
            json.features || [];


        const signature =
            features
                .map(
                    feature =>
                        `${feature.attributes.OBJECTID}:${feature.attributes.GDH}`
                )
                .join("|");


        if (
            signature !==
            lastSignature
        ) {

            renderMessages(
                features
            );

            lastSignature =
                signature;

        }

    }
    catch (error) {

        showStatus(
            `Lecture impossible : ${error.message}`,
            "error"
        );

    }

}


/* ============================================================
   AFFICHAGE DES MESSAGES
   ============================================================ */

function renderMessages(
    features
) {

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML =
        "";


    if (!features.length) {

        container.innerHTML = `
            <div class="system">
                <span>
                    Aucun message dans ce canal
                </span>
            </div>
        `;

        return;

    }


    for (
        const feature
        of features
    ) {

        const attributes =
            feature.attributes || {};


        /* ---------------------------------------------
           DOMAINE AUTEUR

           1 = PC TRANSFERT
           2 = CONVOI-01
           --------------------------------------------- */

        const author =
            attributes.Auteur == 2
                ? "CONVOI-01"
                : "PC TRANSFERT";


        /* ---------------------------------------------
           DOMAINE TYPE

           1 = NORMAL
           2 = ALERTE
           3 = SYSTEME
           --------------------------------------------- */

        const type =
            attributes.Types;


        /* ---------------------------------------------
           MESSAGE SYSTEME
           --------------------------------------------- */

        if (type == 3) {

            const system =
                document.createElement(
                    "div"
                );


            system.className =
                "system";


            system.innerHTML = `
                <span>
                    ${esc(attributes.Message)}
                </span>
            `;


            container.appendChild(
                system
            );

            continue;

        }


        /* ---------------------------------------------
           MESSAGE PC / CONVOI
           --------------------------------------------- */

        const side =
            attributes.Auteur == 2
                ? "convoi"
                : "pc";


        const alert =
            type == 2
                ? " alert"
                : "";


        const item =
            document.createElement(
                "div"
            );


        item.className =
            `message ${side}${alert}`;


        item.innerHTML = `

            <div class="meta">

                <span class="sender">
                    ${esc(author)}
                </span>

                <span>
                    ${formatTime(attributes.GDH)}
                </span>

            </div>


            <div class="bubble">
                ${esc(attributes.Message)}
            </div>

        `;


        container.appendChild(
            item
        );

    }


    /* Scroll automatique */

    container.scrollTop =
        container.scrollHeight;

}


/* ============================================================
   AJOUT D'UN MESSAGE
   ============================================================ */

async function addMessage(
    author,
    message,
    type = "NORMAL"
) {

    /* ---------------------------------------------
       CODE DOMAINE AUTEUR
       --------------------------------------------- */

    const authorCode =
        author === "CONVOI-01"
            ? 2
            : 1;


    /* ---------------------------------------------
       CODE DOMAINE TYPE
       --------------------------------------------- */

    let typeCode = 1;


    if (type === "ALERTE") {

        typeCode = 2;

    }
    else if (
        type === "SYSTEME"
    ) {

        typeCode = 3;

    }


    /* ---------------------------------------------
       ENTITE ARCGIS
       --------------------------------------------- */

    const feature = {

        attributes: {

            Mission:
                MISSION_ID,

            Auteur:
                authorCode,

            Message:
                message,

            GDH:
                Date.now(),

            Types:
                typeCode

        }

    };


    /* ---------------------------------------------
       AJOUT DANS FEATURE SERVICE
       --------------------------------------------- */

    const json =
        await arcgisPost(
            "addFeatures",
            {
                features:
                    JSON.stringify(
                        [feature]
                    ),

                rollbackOnFailure:
                    "true"
            }
        );


    const result =
        json.addResults?.[0];


    if (
        !result ||
        !result.success
    ) {

        throw new Error(
            result?.error?.description ||
            "Ajout refusé par le service"
        );

    }


    await loadMessages();

}


/* ============================================================
   ENVOI MANUEL
   ============================================================ */

async function sendMessage() {

    if (sending) {
        return;
    }


    if (
        AUTHOR ===
        "ROLE NON DEFINI"
    ) {

        showStatus(
            "Rôle non défini. Utilisez ?role=pc ou ?role=convoi.",
            "error"
        );

        return;

    }


    const input =
        document.getElementById(
            "input"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    sending =
        true;


    document
        .getElementById("send")
        .disabled =
            true;


    try {

        await addMessage(
            AUTHOR,
            text,
            "NORMAL"
        );


        input.value =
            "";

    }
    catch (error) {

        showStatus(
            `Envoi impossible : ${error.message}`,
            "error"
        );

    }
    finally {

        sending =
            false;


        document
            .getElementById("send")
            .disabled =
                false;


        input.focus();

    }

}


/* ============================================================
   TOUCHE ENTREE
   ============================================================ */

document
    .getElementById("input")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* ============================================================
   SCENARIOS DE DEMONSTRATION
   ============================================================ */

async function scenario(
    kind
) {

    try {

        /* TRAFIC */

        if (
            kind ===
            "TRAFIC"
        ) {

            await addMessage(
                "PC TRANSFERT",
                "Vigilance trafic signalée sur l’itinéraire. Situation en cours d’évaluation.",
                "ALERTE"
            );

        }


        /* SECURITE */

        if (
            kind ===
            "SECURITE"
        ) {

            await addMessage(
                "PC TRANSFERT",
                "Événement de sécurité signalé sur le secteur. Maintenez la vigilance.",
                "ALERTE"
            );

        }


        /* INCIDENT */

        if (
            kind ===
            "INCIDENT"
        ) {

            await addMessage(
                "CONVOI-01",
                "Incident véhicule. Immobilisation temporaire.",
                "ALERTE"
            );


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        600
                    )
            );


            await addMessage(
                "PC TRANSFERT",
                "Bien reçu. Mission placée en attente. Maintenez la position.",
                "ALERTE"
            );

        }


        /* REPRISE */

        if (
            kind ===
            "REPRISE"
        ) {

            await addMessage(
                "CONVOI-01",
                "Incident résolu. Véhicule opérationnel.",
                "NORMAL"
            );


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        600
                    )
            );


            await addMessage(
                "PC TRANSFERT",
                "Reçu. Reprise du transfert autorisée.",
                "NORMAL"
            );

        }

    }
    catch (error) {

        showStatus(
            `Scénario impossible : ${error.message}`,
            "error"
        );

    }

}


/* ============================================================
   DEMARRAGE
   ============================================================ */

loadMessages();


setInterval(
    loadMessages,
    POLL_MS
);

</script>

</body>
</html>
