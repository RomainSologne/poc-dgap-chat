<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fil opérationnel DGAP</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;font-family:"Avenir Next",Arial,sans-serif;background:#002632;color:#EAF2F7}
.chat{width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:12px 14px;border-bottom:1px solid #174652;background:#002632}.header-top{display:flex;justify-content:space-between;align-items:center}.title{font-size:13px;font-weight:700;letter-spacing:.5px}.live{color:#39D98A;font-size:10px;font-weight:700}.subtitle{margin-top:4px;font-size:11px;color:#91A7B4}
.messages{flex:1;overflow-y:auto;padding:12px;scroll-behavior:smooth}.message{max-width:88%;margin-bottom:12px}.message.pc{margin-right:auto}.message.convoi{margin-left:auto}.meta{display:flex;justify-content:space-between;gap:15px;margin-bottom:4px;font-size:10px;color:#91A7B4}.sender{font-weight:700}.pc .sender{color:#F59E0B}.convoi .sender{color:#39D98A}.bubble{padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.pc .bubble{background:#5A392C;border-left:3px solid #F59E0B}.convoi .bubble{background:#16463E;border-right:3px solid #39D98A}.message.alert .bubble{background:#4A3027;border-left:3px solid #F59E0B}.message.alert .sender{color:#F59E0B}.system{text-align:center;color:#91A7B4;font-size:10px;margin:12px 0}.system span{background:#10333E;border-radius:12px;padding:4px 9px}
.status{display:none;padding:7px 10px;font-size:10px;border-top:1px solid #174652}.status.error{display:block;background:#4A2020;color:#FFB8B8}.status.info{display:block;background:#10333E;color:#AFC2CE}
.demo-actions{display:flex;gap:5px;padding:7px 10px;border-top:1px solid #174652;background:#002632}.demo-actions button{flex:1;border:1px solid #28515D;background:#0C3541;color:#AFC2CE;border-radius:5px;padding:6px 3px;font-size:9px;cursor:pointer}.demo-actions button:hover{background:#174652;color:#fff}
.input-area{display:flex;padding:10px;gap:7px;background:#001E27;border-top:1px solid #174652}.input-area input{flex:1;background:#0C3541;border:1px solid #28515D;border-radius:6px;padding:9px 10px;color:#fff;outline:none;font-size:12px}.input-area input::placeholder{color:#778E99}.input-area input:focus{border-color:#39D98A}.send{width:38px;border:0;border-radius:6px;background:#007AC2;color:#fff;font-size:15px;cursor:pointer}.send:disabled,.demo-actions button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<div class="chat">
  <div class="header"><div class="header-top"><div class="title">FIL OPÉRATIONNEL</div><div class="live">● EN DIRECT</div></div><div class="subtitle" id="subtitle">TRANSFERT-001 • CONVOI-01</div></div>
  <div class="messages" id="messages"><div class="system"><span>Connexion au canal opérationnel…</span></div></div>
  <div class="status" id="status"></div>
  <div class="demo-actions">
    <button onclick="scenario('TRAFIC')">TRAFIC</button><button onclick="scenario('SECURITE')">SÉCURITÉ</button><button onclick="scenario('INCIDENT')">INCIDENT</button><button onclick="scenario('REPRISE')">REPRISE</button>
  </div>
  <div class="input-area"><input id="input" type="text" placeholder="Écrire un message…" autocomplete="off"><button id="send" class="send" onclick="sendMessage()">➤</button></div>
</div>
<script>
const SERVICE_URL = "https://services.arcgis.com/d3voDfTFbHOCRwVR/arcgis/rest/services/Messages_Transfert/FeatureServer/0";
const MISSION_ID = "TRANSFERT-001";
const params = new URLSearchParams(location.search);
const role = (params.get("role") || "pc").toLowerCase();
const AUTHOR = role === "convoi" ? "CONVOI-01" : "PC TRANSFERT";
const POLL_MS = 2000;
let lastSignature = "";
let sending = false;

document.getElementById("subtitle").textContent = `${MISSION_ID} • ${AUTHOR}`;

function esc(v){return String(v ?? "").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function formatTime(epoch){const d=new Date(epoch);return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});}
function showStatus(text,type="info"){const e=document.getElementById("status");e.className=`status ${type}`;e.textContent=text; if(type==="info") setTimeout(()=>{e.className="status";},1800);}

async function arcgisPost(path, data){
  const body = new URLSearchParams({...data, f:"json"});
  const response = await fetch(`${SERVICE_URL}/${path}`, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"}, body});
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  const json = await response.json();
  if(json.error) throw new Error(json.error.message + (json.error.details?.length ? `: ${json.error.details.join("; ")}` : ""));
  return json;
}

async function loadMessages(){

    try {

        const where =
            `Mission='${MISSION_ID.replaceAll("'","''")}'`;

        const json = await arcgisPost("query", {
            where: where,
            outFields: "OBJECTID,Mission,Auteur,Message,GDH,Types",
            orderByFields: "GDH ASC, OBJECTID ASC",
            returnGeometry: "false",
            resultRecordCount: "500"
        });

        const features = json.features || [];

        const signature = features
            .map(f =>
                `${f.attributes.OBJECTID}:${f.attributes.GDH}`
            )
            .join("|");

        if(signature !== lastSignature) {
            renderMessages(features);
            lastSignature = signature;
        }

    }
    catch(err) {
        showStatus(
            `Lecture impossible : ${err.message}`,
            "error"
        );
    }
}

function renderMessages(features){

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    if(!features.length){

        container.innerHTML =
            '<div class="system">' +
            '<span>Aucun message dans ce canal</span>' +
            '</div>';

        return;
    }

    for(const f of features){

        const a = f.attributes || {};

        // Domaine Auteur
        const author =
            a.Auteur == 2
                ? "CONVOI-01"
                : "PC TRANSFERT";

        // Domaine Types
        const type = a.Types;

        // SYSTEME = 3
        if(type == 3){

            const sys =
                document.createElement("div");

            sys.className = "system";

            sys.innerHTML =
                `<span>${esc(a.Message)}</span>`;

            container.appendChild(sys);

            continue;
        }

        const side =
            a.Auteur == 2
                ? "convoi"
                : "pc";

        // ALERTE = 2
        const alert =
            type == 2
                ? " alert"
                : "";

        const item =
            document.createElement("div");

        item.className =
            `message ${side}${alert}`;

        item.innerHTML = `
            <div class="meta">

                <span class="sender">
                    ${esc(author)}
                </span>

                <span>
                    ${formatTime(a.GDH)}
                </span>

            </div>

            <div class="bubble">
                ${esc(a.Message)}
            </div>
        `;

        container.appendChild(item);
    }

    container.scrollTop =
        container.scrollHeight;
}

async function addMessage(
    author,
    message,
    type = "NORMAL"
){

    // Domaine Auteur
    const authorCode =
        author === "CONVOI-01"
            ? 2
            : 1;

    // Domaine Types
    let typeCode = 1;

    if(type === "ALERTE"){
        typeCode = 2;
    }
    else if(type === "SYSTEME"){
        typeCode = 3;
    }

    const feature = {

        attributes: {

            Mission:
                MISSION_ID,

            Auteur:
                authorCode,

            Message:
                message,

            GDH:
                Date.now(),

            Types:
                typeCode
        }
    };

    const json = await arcgisPost(
        "addFeatures",
        {
            features:
                JSON.stringify([feature]),

            rollbackOnFailure:
                "true"
        }
    );

    const result =
        json.addResults?.[0];

    if(!result?.success){

        throw new Error(
            result?.error?.description ||
            "Ajout refusé par le service"
        );
    }

    await loadMessages();
}

async function sendMessage(){
  if(sending) return; const input=document.getElementById("input"); const text=input.value.trim(); if(!text) return;
  sending=true;document.getElementById("send").disabled=true;
  try{await addMessage(AUTHOR,text,"NORMAL");input.value="";}catch(err){showStatus(`Envoi impossible : ${err.message}`,"error");}
  finally{sending=false;document.getElementById("send").disabled=false;input.focus();}
}

document.getElementById("input").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMessage();}});

async function scenario(kind){
  try{
    if(kind==="TRAFIC") await addMessage("PC TRANSFERT","Vigilance trafic signalée sur l’itinéraire. Situation en cours d’évaluation.","ALERTE");
    if(kind==="SECURITE") await addMessage("PC TRANSFERT","Événement de sécurité signalé sur le secteur. Maintenez la vigilance.","ALERTE");
    if(kind==="INCIDENT"){
      await addMessage("CONVOI-01","Incident véhicule. Immobilisation temporaire.","ALERTE");
      await new Promise(r=>setTimeout(r,600));
      await addMessage("PC TRANSFERT","Bien reçu. Mission placée en attente. Maintenez la position.","ALERTE");
    }
    if(kind==="REPRISE"){
      await addMessage("CONVOI-01","Incident résolu. Véhicule opérationnel.","NORMAL");
      await new Promise(r=>setTimeout(r,600));
      await addMessage("PC TRANSFERT","Reçu. Reprise du transfert autorisée.","NORMAL");
    }
  }catch(err){showStatus(`Scénario impossible : ${err.message}`,"error");}
}

loadMessages(); setInterval(loadMessages,POLL_MS);
</script>
</body>
</html>
