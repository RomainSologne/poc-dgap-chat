<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fil opérationnel</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: "Avenir Next", Arial, sans-serif;
    background: #002632;
    color: #EAF2F7;
}

.chat {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* HEADER */

.header {
    padding: 12px 14px;
    border-bottom: 1px solid #174652;
    background: #002632;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: .5px;
}

.live {
    color: #39D98A;
    font-size: 10px;
    font-weight: bold;
}

.subtitle {
    margin-top: 4px;
    font-size: 11px;
    color: #91A7B4;
}

/* MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    scroll-behavior: smooth;
}

.message {
    max-width: 88%;
    margin-bottom: 12px;
}

.message.pc {
    margin-right: auto;
}

.message.convoi {
    margin-left: auto;
}

.meta {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 4px;
    font-size: 10px;
    color: #91A7B4;
}

.sender {
    font-weight: bold;
}

.pc .sender {
    color: #58A6D6;
}

.convoi .sender {
    color: #39D98A;
}

.bubble {
    padding: 9px 11px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.45;
}

.pc .bubble {
    background: #163B48;
    border-left: 3px solid #58A6D6;
}

.convoi .bubble {
    background: #16463E;
    border-right: 3px solid #39D98A;
}

/* ALERTE */

.message.alert .bubble {
    background: #4A3027;
    border-left: 3px solid #F59E0B;
}

.message.alert .sender {
    color: #F59E0B;
}

/* EVENEMENT SYSTEME */

.system {
    text-align: center;
    color: #91A7B4;
    font-size: 10px;
    margin: 14px 0;
}

.system span {
    background: #10333E;
    border-radius: 12px;
    padding: 4px 9px;
}

/* ACTIONS DEMO */

.demo-actions {
    display: flex;
    gap: 5px;
    padding: 7px 10px;
    border-top: 1px solid #174652;
    background: #002632;
}

.demo-actions button {
    flex: 1;
    border: 1px solid #28515D;
    background: #0C3541;
    color: #AFC2CE;
    border-radius: 5px;
    padding: 5px 3px;
    font-size: 9px;
    cursor: pointer;
}

.demo-actions button:hover {
    background: #174652;
    color: white;
}

/* ZONE DE SAISIE */

.input-area {
    display: flex;
    padding: 10px;
    gap: 7px;
    background: #001E27;
    border-top: 1px solid #174652;
}

.input-area input {
    flex: 1;
    background: #0C3541;
    border: 1px solid #28515D;
    border-radius: 6px;
    padding: 9px 10px;
    color: white;
    outline: none;
    font-size: 12px;
}

.input-area input::placeholder {
    color: #778E99;
}

.input-area input:focus {
    border-color: #39D98A;
}

.send {
    width: 38px;
    border: none;
    border-radius: 6px;
    background: #007AC2;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.send:hover {
    background: #1693D2;
}

</style>
</head>


<body>

<div class="chat">

    <!-- HEADER -->

    <div class="header">

        <div class="header-top">

            <div class="title">
                FIL OPÉRATIONNEL
            </div>

            <div class="live">
                ● EN DIRECT
            </div>

        </div>

        <div class="subtitle">
            TRANSFERT-001 • CONVOI-01
        </div>

    </div>


    <!-- MESSAGES -->

    <div class="messages" id="messages">

        <div class="system">
            <span>Canal opérationnel ouvert</span>
        </div>


        <div class="message pc">

            <div class="meta">
                <span class="sender">PC TRANSFERT</span>
                <span>19:00</span>
            </div>

            <div class="bubble">
                Mission TRANSFERT-001 autorisée.
                Itinéraire validé.
            </div>

        </div>


        <div class="message convoi">

            <div class="meta">
                <span class="sender">CONVOI-01</span>
                <span>19:01</span>
            </div>

            <div class="bubble">
                Reçu. Prise en charge effectuée.
                Départ de Fresnes.
            </div>

        </div>


        <div class="message pc">

            <div class="meta">
                <span class="sender">PC TRANSFERT</span>
                <span>19:03</span>
            </div>

            <div class="bubble">
                Position reçue. Poursuivez selon
                l'itinéraire planifié.
            </div>

        </div>

    </div>


    <!-- BOUTONS POUR JOUER LA DEMO -->

    <div class="demo-actions">

        <button onclick="scenarioTraffic()">
            TRAFIC
        </button>

        <button onclick="scenarioSecurity()">
            SÉCURITÉ
        </button>

        <button onclick="scenarioIncident()">
            INCIDENT
        </button>

        <button onclick="scenarioResume()">
            REPRISE
        </button>

    </div>


    <!-- SAISIE -->

    <div class="input-area">

        <input
            id="input"
            type="text"
            placeholder="Écrire un message..."
            autocomplete="off"
        >

        <button
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>

/* HEURE COURANTE */

function timeNow() {

    const now = new Date();

    return now.toLocaleTimeString(
        "fr-FR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* AJOUT MESSAGE */

function addMessage(sender, text, type = "pc") {

    const container =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const meta =
        document.createElement("div");

    meta.className = "meta";


    const senderElement =
        document.createElement("span");

    senderElement.className = "sender";
    senderElement.textContent = sender;


    const time =
        document.createElement("span");

    time.textContent = timeNow();


    const bubble =
        document.createElement("div");

    bubble.className = "bubble";
    bubble.textContent = text;


    meta.appendChild(senderElement);
    meta.appendChild(time);

    message.appendChild(meta);
    message.appendChild(bubble);

    container.appendChild(message);

    container.scrollTop =
        container.scrollHeight;

}


/* ENVOI MANUEL */

function sendMessage() {

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();

    if (!text) return;

    addMessage(
        "PC TRANSFERT",
        text,
        "pc"
    );

    input.value = "";

}


/* TOUCHE ENTREE */

document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }
    );


/* ============================================================
   SCENARIO DEMO
   ============================================================ */


/* TRAFIC */

function scenarioTraffic() {

    addMessage(
        "PC TRANSFERT",
        "Vigilance trafic signalée sur l'itinéraire. Situation en cours d'évaluation.",
        "alert"
    );

}


/* EVENEMENT SECURITE */

function scenarioSecurity() {

    addMessage(
        "PC TRANSFERT",
        "Événement de sécurité signalé sur le secteur. Maintenez la vigilance.",
        "alert"
    );

}


/* INCIDENT CONVOI */

function scenarioIncident() {

    addMessage(
        "CONVOI-01",
        "Incident véhicule. Immobilisation temporaire.",
        "convoi"
    );

    setTimeout(function() {

        addMessage(
            "PC TRANSFERT",
            "Bien reçu. Mission placée en attente. Maintenez la position.",
            "alert"
        );

    }, 1000);

}


/* REPRISE */

function scenarioResume() {

    addMessage(
        "CONVOI-01",
        "Incident résolu. Véhicule opérationnel.",
        "convoi"
    );

    setTimeout(function() {

        addMessage(
            "PC TRANSFERT",
            "Reçu. Reprise du transfert autorisée.",
            "pc"
        );

    }, 1000);

}


/* POSITION INITIALE DU SCROLL */

window.onload = function() {

    const container =
        document.getElementById("messages");

    container.scrollTop =
        container.scrollHeight;

};

</script>

</body>
</html>
